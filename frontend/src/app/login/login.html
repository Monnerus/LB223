<div class="login-wrapper">
  <div class="login-card">
    <h1>Anmelden</h1>

    @if (error()) {
      <div class="message error">{{ error() }}</div>
    }

    <div class="field">
      <label>Benutzername</label>
      <input type="text" [ngModel]="username()" (ngModelChange)="username.set($event)" autocomplete="username">
    </div>

    <div class="field">
      <label>Passwort</label>
      <input type="password" [ngModel]="password()" (ngModelChange)="password.set($event)" autocomplete="current-password">
    </div>

    <button class="btn-login" (click)="submit()" [disabled]="loading()">
      {{ loading() ? 'Lädt...' : 'Anmelden' }}
    </button>
  </div>
</div>
